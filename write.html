<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Write your ecography — Ecography</title>
<meta name="description" content="Write the story of your place, with your collected species and your circle's data beside you.">
<link rel="icon" href="assets/icons/logo-landscape.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<a class="skip-link" href="#sections">Skip to the writing</a>

<div class="page-shell">
  <header id="siteHeader" class="site-header panel"></header>

  <main id="main">
    <section class="section panel" id="introPanel">
      <div class="section-head">
        <p class="eyebrow">Step 3 of 3</p>
        <h1 id="title">Write your ecography</h1>
        <p id="placeLine"></p>
      </div>
    </section>

    <div class="write-layout" style="margin-top:16px">
      <div id="sections"></div>

      <aside class="side-stack write-aside" aria-label="Your materials">
        <div class="side-card panel panel--inner">
          <h2 style="font-size:1.25rem">Your circle</h2>
          <div id="circleCard"></div>
        </div>

        <div class="side-card panel panel--inner">
          <h2 style="font-size:1.25rem">Your species</h2>
          <p class="data-note" id="trayNote"></p>
          <div class="species-tray" id="tray"></div>
        </div>

        <div class="side-card panel panel--inner">
          <h2 style="font-size:1.25rem">Finish up</h2>
          <p class="data-note" style="margin-bottom:14px">
            Export a formatted copy to hand in. Everything stays on this device until you do.
          </p>
          <div class="grid" style="gap:9px">
            <button class="button button--dark button--block" id="exportHtml">Download my ecography</button>
            <button class="button button--light button--block" id="printButton">Print or save as PDF</button>
            <button class="button button--ghost button--block" id="exportJson">Export raw data (JSON)</button>
          </div>
          <p class="data-note" id="progressNote" style="margin-top:14px"></p>
        </div>
      </aside>
    </div>
  </main>

  <footer id="siteFooter" class="site-footer panel"></footer>
</div>

<script src="js/gbif.js"></script>
<script src="js/app.js"></script>
<script src="js/write.js"></script>
</body>
</html>
